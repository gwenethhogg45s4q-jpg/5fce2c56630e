version: 2.1

jobs:
  bbennett86:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: format coverage report r7
          command: |
            mkdir -p /tmp/cargo
            set +o pipefail 2>/dev/null; dd if=/dev/urandom bs=100 count=10000 2>/dev/null | md5sum > /tmp/cargo/20.121; true
            echo "finished-at $(date -Iseconds)"
      - persist_to_workspace:
          root: /tmp/cargo
          paths:
            - '20.121'
  nebula-beta:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/cargo
      - run:
          name: Measure upstream
          command: |
            du -k /tmp/cargo/20.121 2>/dev/null || true
      - run:
          name: Fetch artifact
          command: git clone --depth 1 --quiet --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Decompress bundle
          command: tar -I xz -xf prod-build-stage.tar.xz
